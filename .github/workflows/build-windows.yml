name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows EXE (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Prepare offline OCR assets and build frontend
        run: npm run build

      - name: Build Tauri bundles (NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis,msi

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "artifacts/Qexam-Teacher-Setup.exe"
            Write-Host "NSIS installer: $($nsis.Name) ($([math]::Round($nsis.Length/1MB,2)) MB)"
          } else {
            Write-Host "::error::NSIS installer was not produced"
            exit 1
          }
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "artifacts/Qexam-Teacher.msi"
            Write-Host "MSI installer: $($msi.Name) ($([math]::Round($msi.Length/1MB,2)) MB)"
          }
          Get-ChildItem artifacts | ForEach-Object { "$($_.Name) $($_.Length) bytes" } | Set-Content artifacts/build-report.txt
          Get-Content artifacts/build-report.txt

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Qexam-Teacher-Windows
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/Qexam-Teacher-Setup.exe
            artifacts/Qexam-Teacher.msi
            artifacts/build-report.txt
