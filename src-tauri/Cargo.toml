[package]
name = "qexam-teacher"
version = "1.0.0"
description = "Qexam Teacher - AI-Powered Educational Worksheet Studio"
authors = ["Qexam Teacher"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qexam_teacher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
